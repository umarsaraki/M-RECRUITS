<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,o)=>{const r=await fetch('/api'+p,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'Request failed'),{data:d});return d};
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const st=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
// Storage adapter: today = this browser. When accounts are introduced, replace get/set with Worker API calls (saved_jobs / applications tables) and nothing else changes.
const Store={get:k=>ls('mr_'+k,[]),set:(k,v)=>st('mr_'+k,v)};
const post=(p,b)=>api(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
const sym={NGN:'₦',USD:'$',GBP:'£',EUR:'€',GHS:'GH₵',KES:'KSh '},cmp=n=>n>=1e6?+(n/1e6).toFixed(1)+'M':n>=1e3?+(n/1e3).toFixed(0)+'k':n;
const money=j=>{if(j.salary_type==='negotiable')return 'Negotiable';if(j.salary_type==='undisclosed'||(!j.salary_min&&!j.salary_max))return '';const c=sym[j.currency]||(j.currency?j.currency+' ':'');return [j.salary_min,j.salary_max].filter(Boolean).map(n=>c+cmp(n)).join(' – ')};
const when=d=>{const t=new Date(String(d).replace(' ','T')+'Z');return isNaN(t)?'':t.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})};
const saved=()=>Store.get('saved'),isSaved=id=>saved().some(j=>j.id===id);
function toggleSave(j){let s=saved();s=isSaved(j.id)?s.filter(x=>x.id!==j.id):[...s,{id:j.id,title:j.title,company:j.company,location:j.location,at:Date.now()}];Store.set('saved',s)}
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const ini=s=>String(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const logoEl=j=>j.logo_key?`<img class="logo-c" src="/media/${encodeURI(j.logo_key)}" alt="" width="50" height="50" loading="lazy">`:`<div class="logo-c" aria-hidden="true">${esc(ini(j.company))}</div>`;
const jobCard=j=>`<article class="card jc"><div class="jh">${logoEl(j)}<div><h3>${esc(j.title)}</h3><small>${esc(j.company)} · ${ic('pin')} ${esc(j.location)}</small></div><button class="bk ${isSaved(j.id)?'on':''}" data-save='${esc(JSON.stringify({id:j.id,title:j.title,company:j.company,location:j.location}))}' aria-pressed="${isSaved(j.id)}" aria-label="${isSaved(j.id)?'Remove from':'Save to'} favorites">${ic('heart')}</button></div>
<div><span class="tag">${esc(j.employment_type||'')}</span>${money(j)?`<span class="tag g">${esc(money(j))}</span>`:''}${j.deadline?`<span class="tag">Closes ${esc(j.deadline)}</span>`:''}</div><a class="btn alt" href="#/job/${j.id}">View Job ${ic('arrow')}</a></article>`;
const empty=m=>`<div class="empty">${esc(m)}</div>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-save]');if(b){const jb=JSON.parse(b.dataset.save);toggleSave(jb);if(/^#\/(apps|job\/)/.test(location.hash))return route();const on=isSaved(jb.id);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)}});
$('#bell').onclick=()=>alert('No new notifications. Notifications will arrive when accounts are introduced.');

function form(id,fields,btn){return `<form id="${id}" novalidate>${fields}<div class="err" role="alert" aria-live="polite" id="${id}-e"></div><button class="btn alt" style="margin-top:12px">${btn}</button></form>`}
const f=(n,l,t='text',extra='')=>`<label for="${n}">${l}</label><input id="${n}" name="${n}" type="${t}" ${extra}>`;
const ta=(n,l,v='')=>`<label for="${n}">${l}</label><textarea id="${n}" name="${n}" rows="3">${esc(v)}</textarea>`;
function wire(id,fn){const el=document.getElementById(id);el.onsubmit=async e=>{e.preventDefault();const er=document.getElementById(id+'-e'),b=el.querySelector('button');er.textContent='';b.disabled=true;
 try{await fn(el)}catch(x){er.textContent=x.message+(x.data?.fields?' — '+Object.entries(x.data.fields).map(([k,v])=>k+': '+v).join('; '):'')}b.disabled=false}}
const done=(el,m)=>{el.outerHTML=`<div class="ok" role="status">${m}</div>`};
const ob=el=>Object.fromEntries(new FormData(el));

// ---------- pages ----------
const catIc=n=>/tech|it\b|software|comput/i.test(n)?'laptop':/financ|account|bank/i.test(n)?'calc':/health|medic|nurs/i.test(n)?'pulse':/admin|office|hr|human/i.test(n)?'users':/engineer/i.test(n)?'gear':/educat|teach/i.test(n)?'cap':'briefcase';
const svIc=s=>/cv/.test(s)?'doc':/train/.test(s)?'cap':/career/.test(s)?'compass':/interview|onboard/.test(s)?'chat':'users';
const safeL=l=>/^(#|\/)/.test(l||'')?l:'#/jobs';
async function home(){
 const [bn,cats,feat,svc,stat]=await Promise.all([api('/banners'),api('/categories'),api('/jobs?featured=1&size=6'),api('/services'),api('/stats')].map(p=>p.catch(()=>null)));
 const real=!!bn?.length,slides=real?bn:[{},{},{}];
 const sl=real?bn.map((b,i)=>{const L=/^(#|\/)/.test(b.link||'')?b.link:'',T=L?'a':'div',cap=b.headline||b.subtitle?`<div class="cap">${b.headline?`<h2>${esc(b.headline)}</h2>`:''}${b.subtitle?`<p>${esc(b.subtitle)}</p>`:''}</div>`:'';
 return `<div class="sl ${i?'':'on'}"><${T} class="bnl" ${L?`href="${esc(L)}"`:''}><img class="bimg" src="/media/${encodeURI(b.image_key)}" alt="${esc(b.headline||'M-RECRUITS banner')}" width="1600" height="800" ${i?'loading="lazy"':'fetchpriority="high"'}>${cap}</${T}></div>`}).join(''):[['Find the Right <em>Opportunity</em>','Your next career move starts here. Discover opportunities and connect with top employers.','Explore Jobs','#/jobs','briefcase'],['Hire the Right <em>Talent</em>','Tell us who you need and we will recruit, screen and shortlist reliable candidates.','Request Staffing','#/employer','users'],['Build a Stronger <em>Career</em>','Professional CV writing, career guidance and interview support to help you stand out.','Our Services','#/services','doc']].map((x,i)=>`<div class="sl ${i?'':'on'}">${i?`<span class="wm">${ic(x[4])}</span>`:`<img class="hero-img" src="/img/hero-team.jpg" alt="" width="630" height="470" fetchpriority="high" onerror="this.remove()">`}<div class="hero-in"><h1>${x[0]}</h1><p>${x[1]}</p><a class="btn" href="${x[3]}">${x[2]} ${ic('arrow')}</a></div></div>`).join('');
 const sh=(i,t,l)=>`<div class="sh"><h2>${ic(i)} ${t}</h2>${l?`<a href="${l}">View All ${ic('arrow')}</a>`:''}</div>`,bar=(i,t,l)=>`<div class="bar"><h2>${ic(i)} ${t}</h2>${l?`<a href="${l}">View All ${ic('arrow')}</a>`:''}</div>`,num=n=>Number(n||0).toLocaleString();
 const sts=stat?[['briefcase',stat.jobs,'Jobs Available'],['users',stat.applications,'Applications Received'],['building',stat.employers,'Employer Inquiries'],['layers',svc?.length||0,'Services Offered']]:[];
 app.innerHTML=`<section class="hero ${real?'bnr':''}" aria-roledescription="carousel" aria-label="Featured">${sl}${slides.length>1?`<div class="dots">${slides.map((_,i)=>`<button class="${i?'':'on'}" aria-label="Slide ${i+1}"></button>`).join('')}</div>`:''}</section>
 <form class="sbar" id="hs" role="search"><h2 class="tab">${ic('search')} Search for Jobs</h2><div class="fld">${ic('briefcase')}<input name="q" placeholder="Job title or keyword" aria-label="Job title or keyword"></div><div class="fld">${ic('pin')}<input name="location" placeholder="Location" aria-label="Location"></div><button class="btn alt">${ic('search')} Search</button></form>
 <section class="s">${sh('layers','Explore Job Categories','#/jobs')}${cats?.length?`<div class="cats">${cats.map(c=>`<a class="cat" href="#/jobs?category=${c.id}">${ic(catIc(c.name))}<span>${esc(c.name)}</span></a>`).join('')}<a class="cat" href="#/jobs">${ic('dots')}<span>More</span></a></div>`:empty('Categories will appear here once added by the admin.')}</section>
 <section class="s">${bar('star','Featured Jobs','#/jobs')}${feat?.jobs?.length?`<div class="grid fj">${feat.jobs.map(jobCard).join('')}</div>`:empty('No featured vacancies right now. Check back soon.')}</section>
 <section class="why2"><h2 class="tab2">${ic('award')} Why Choose M-RECRUITS?</h2><div class="w4">${[['shield','Trusted Employers'],['target','Quality Opportunities'],['trend','Career Development'],['headset','Reliable Support']].map(x=>`<div>${ic(x[0])}<span>${x[1]}</span></div>`).join('')}</div></section>
 <section class="svp">${bar('layers','Our Services','#/services')}${svc?.length?`<div class="svg">${svc.map(s=>`<a class="sv" href="#/service/${s.id}">${ic(svIc(s.slug))}<span>${esc(s.name)}</span></a>`).join('')}</div>`:empty('Services will appear here soon.')}</section>
  ${sts.length&&(stat.jobs||stat.applications||stat.employers)?`<section class="st4" aria-label="Statistics">${sts.map(x=>`<div>${ic(x[0])}<b>${num(x[1])}</b>${x[2]}</div>`).join('')}</section>`:''}
 <section class="cta2">${ic('award','tro')}<div><h2>Start Your Journey With Us</h2><p>Find a Job or Hire Talent with M-RECRUITS.</p></div><div class="row"><a class="btn" href="#/jobs">Find a Job ${ic('arrow')}</a><a class="btn line" href="#/employer">Hire Talent ${ic('arrow')}</a></div></section>`;
 $('#hs').onsubmit=e=>{e.preventDefault();location.hash='#/jobs?'+new URLSearchParams([...new FormData(e.target)].filter(x=>x[1]))};
 if(slides.length>1){let c=0;const S=app.querySelectorAll('.sl'),D=app.querySelectorAll('.dots button'),go=n=>{c=n;S.forEach((x,i)=>x.classList.toggle('on',i===n));D.forEach((x,i)=>x.classList.toggle('on',i===n))};D.forEach((d,i)=>d.onclick=()=>go(i));if(!matchMedia('(prefers-reduced-motion:reduce)').matches)window.__hs=setInterval(()=>go((c+1)%S.length),5500)}}

async function jobs(qs){
 const p=new URLSearchParams(qs),g=k=>p.get(k)||'';
 const [cats,fl]=await Promise.all([api('/categories').catch(()=>[]),api('/job-filters').catch(()=>({countries:[],states:[],cities:[]}))]);
 const opt=(arr,v,all)=>(all?`<option value="">${all}</option>`:'')+arr.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return `<option value="${esc(a)}" ${v==a?'selected':''}>${esc(b)}</option>`}).join('');
 const sel=(n,i,html,l)=>`<label class="pill"><span class="sr">${l}</span>${ic(i)}<select name="${n}" aria-label="${l}">${html}</select>${ic('chev')}</label>`;
 const moreOn=['state','city','mode','currency'].some(k=>g(k));
 app.innerHTML=`<div class="intro"><div class="ibox">${ic('briefcase')}</div><div><h1>Find Your Next <span>Job</span></h1><p>Discover opportunities and grow your career with M-Recruits.</p></div></div>
 <form id="jf" class="jsb" role="search"><div class="jsr"><div class="fld">${ic('search')}<input name="q" value="${esc(g('q'))}" placeholder="Job title or keyword" aria-label="Job title or keyword"></div><div class="fld">${ic('building')}<input name="company" value="${esc(g('company'))}" placeholder="Company name" aria-label="Company name"></div><div class="fld">${ic('pin')}<input name="location" value="${esc(g('location'))}" placeholder="Location" aria-label="Location"></div><button class="btn alt">${ic('search')} Search</button></div>
 <div class="pills">${sel('category','grid4',opt(cats.map(c=>[c.id,c.name]),g('category'),'All Categories'),'Category')}${sel('type','briefcase',opt(['Full Time','Part Time','Contract','Temporary','Internship','Freelance'],g('type'),'Employment Type'),'Employment type')}${sel('salary','cash',opt([['lt100k','Below 100,000'],['100-300k','100,000–300,000'],['300-500k','300,000–500,000'],['500k-1m','500,000–1,000,000'],['gt1m','Above 1,000,000'],['negotiable','Negotiable'],['undisclosed','Not Disclosed']],g('salary'),'Salary Range'),'Salary range')}${sel('country','pin',opt([...fl.countries,['remote','Remote / Worldwide']],g('country'),'Location'),'Country')}</div>
